name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check vesper tests
      - run: python -m pytest -q
      - run: python -m pip check
