[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-svi"
version = "0.1.0"
description = "Point-in-time next-session equity research and signal engine"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<17", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "lightgbm>=4.6,<5", "pyarrow>=19", "exchange-calendars>=4.9,<5", "filelock>=3.17,<4", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[project.scripts]
vesper = "vesper.__main__:main"

[tool.setuptools.packages.find]
include = ["vesper*"]

[tool.setuptools.package-data]
vesper = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
